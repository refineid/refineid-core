[package]
name = "refineid-apdu"
description = "Typed ISO 7816-4 commands and the RefineID card transport port"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[build-dependencies]
refineid-build-number.workspace = true

[dependencies]
zeroize.workspace = true

[dev-dependencies]
refineid-build-number.workspace = true
serde.workspace = true
trybuild.workspace = true

# The loop bound `cargo kani` checks the proof harnesses in
# src/proofs.rs under: two more than the longest run of octets a harness
# compares byte by byte (SHORT_APDU_DATA_MAX, one full chained chunk),
# as the comparison is a loop over its length. Kani's unwinding
# assertions fail the proof if any loop could run longer.
[package.metadata.kani.flags]
default-unwind = "257"
