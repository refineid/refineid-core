name: core-quality

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Core quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-workflow-policy.py

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config

      - name: Reject anonymous protocol numbers
        run: cargo run --locked -p xtask -- check-magic-numbers

      - name: Exercise local check receipts
        run: python3 scripts/test-check-receipt.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint without warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit dependencies for vulnerabilities
        run: cargo audit

      - name: Verify clean working tree
        run: git diff --exit-code
