[package]
name = "refineid-rapp"
description = "Transport-independent Remote Authorization Proxy Protocol core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false
crate-type = ["rlib", "staticlib"]

[features]
default = []
bindings = ["dep:uniffi"]

[lints]
workspace = true

[dependencies]
sha2.workspace = true
snow.workspace = true
uniffi = { workspace = true, optional = true, features = ["cli"] }
zeroize.workspace = true

[[bin]]
name = "refineid-uniffi-bindgen-swift"
path = "src/bin/refineid-uniffi-bindgen-swift.rs"
required-features = ["bindings"]

[dev-dependencies]
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
