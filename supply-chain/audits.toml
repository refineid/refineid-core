[[audits.zeroize]]
who = "Petri Koistinen"
criteria = "safe-to-deploy"
delta = "1.9.0 -> 1.9.1"
notes = "Zeroizing no longer derives Debug (the wrapped secret is not printed); Vec zeroing wipes the spare capacity before clear so elements are wiped once; the internal optimization_barrier calls after volatile writes are removed; the fallback barrier reads the byte as MaybeUninit. The project's fixed arrays and byte vectors still end in the same volatile writes."
