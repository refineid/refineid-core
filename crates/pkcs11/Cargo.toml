[package]
name = "refineid-pkcs11"
description = "PKCS#11 v2.40 cryptoki module for FINEID -- a minimal read-only, sign-only cdylib exposing the card's authentication certificate + private key for Firefox / NSS client-certificate TLS."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
pin-change = []
test-pin-env = []

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "refineid_pkcs11"
doctest = false

[dependencies]
refineid-apdu.workspace = true
refineid-auth.workspace = true
refineid-cms.workspace = true
refineid-digest.workspace = true
refineid-pcsc.workspace = true
refineid-pin-cache.workspace = true
refineid-pkcs15.workspace = true
refineid-sign.workspace = true
refineid-x509.workspace = true
getrandom.workspace = true
hex.workspace = true
spki.workspace = true
zeroize.workspace = true
