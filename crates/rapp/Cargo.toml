[package]
name = "refineid-rapp"
description = "Transport-independent Remote Authorization Proxy Protocol core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
doctest = false
crate-type = ["rlib", "staticlib"]

[features]
default = []
bindings = ["dep:uniffi"]
# Pins handshake ephemerals for the known-answer vectors. Enabled only by
# this crate's own tests, never by a platform build.
test-vectors = []

[lints]
workspace = true

[dependencies]
chacha20poly1305.workspace = true
curve25519-dalek.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
snow.workspace = true
subtle.workspace = true
uniffi = { workspace = true, optional = true, features = ["cli"] }
zeroize.workspace = true

[[bin]]
name = "refineid-uniffi-bindgen-swift"
path = "src/bin/refineid-uniffi-bindgen-swift.rs"
required-features = ["bindings"]

[dev-dependencies]
getrandom = { workspace = true }
hex.workspace = true
refineid-rapp = { path = ".", features = ["test-vectors"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-saphyr.workspace = true
trybuild.workspace = true
